name: Daily Scan

on:
  schedule:
    - cron: "0 17 * * *"  # 10:30 PM IST (17:00 UTC)
  workflow_dispatch:
    inputs:
      force:
        description: "Bypass the NSE trading-day check (testing only, e.g. on a market holiday)"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Full Report Scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: PYTHONPATH=. python scripts/generate_full_report.py ${{ (github.event_name == 'workflow_dispatch' && inputs.force) && '--force' || '' }}

      - name: Commit updated report back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- reports/ storage/trades/ storage/reports/
          git diff --staged --quiet || git commit -m "Daily scan update: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
