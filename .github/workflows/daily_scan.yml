name: Daily Scan

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Full Report Scan
        run: PYTHONPATH=. python scripts/generate_full_report.py

      - name: Commit updated report back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- reports/ storage/trades/ storage/reports/
          git diff --staged --quiet || git commit -m "Daily scan update: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
