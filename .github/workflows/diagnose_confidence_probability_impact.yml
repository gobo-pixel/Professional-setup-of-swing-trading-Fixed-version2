name: Diagnose Confidence-Probability Impact

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Run diagnose_confidence_probability_impact.py
        run: python scripts/diagnose_confidence_probability_impact.py
