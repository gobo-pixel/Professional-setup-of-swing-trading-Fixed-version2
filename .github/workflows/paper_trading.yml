name: Paper Trading

on:
  workflow_run:
    workflows: ["Morning Executor"]
    types: [completed]
  workflow_dispatch:
    inputs:
      force:
        description: "Bypass NSE trading-day check (testing on holidays)"
        type: boolean
        default: false

concurrency:
  group: repo-write-lock
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  paper_trade:
    runs-on: ubuntu-latest
    # Only proceed if triggered manually, or if the Morning Executor run
    # it's chained after actually succeeded (not on failure/skip).
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - uses: actions/checkout@v4

      - name: Check if triggering Morning Executor run genuinely executed
        id: check_genuine
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "genuine=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          RUN_ID="${{ github.event.workflow_run.id }}"
          JOBS=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" -H "Accept: application/vnd.github+json" "https://api.github.com/repos/${{ github.repository }}/actions/runs/$RUN_ID/jobs")
          STEP_CONCLUSION=$(echo "$JOBS" | python3 -c "import json,sys; data=json.load(sys.stdin); jobs=data.get('jobs',[]); steps=[s for j in jobs for s in j.get('steps',[]) if s['name']=='Run Morning Executor']; print(steps[0].get('conclusion','not_found') if steps else 'not_found')")
          if [ "$STEP_CONCLUSION" = "skipped" ]; then
            echo "genuine=false" >> "$GITHUB_OUTPUT"
            echo "Morning Executor's own run was SKIPPED (schedule: fallback self-skip) — Paper Trading skipping too, to avoid a duplicate cycle."
          else
            echo "genuine=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python
        if: steps.check_genuine.outputs.genuine == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        if: steps.check_genuine.outputs.genuine == 'true'
        run: pip install -r requirements.txt

      - name: Run Paper Trading Cycle
        id: paper_trading
        if: steps.check_genuine.outputs.genuine == 'true'
        # The Python script itself is the authoritative trading-day gate
        # (core/trading_calendar.py) — cron/workflow_run triggers do not
        # understand NSE holidays, so PaperTradingEngine.run_cycle()
        # checks the calendar and skips the whole cycle on non-trading
        # days (no new entries, no monitoring) regardless of how/when
        # this workflow itself was triggered. The script writes
        # ran_cycle=true/false to GITHUB_OUTPUT so the Analysis Engine
        # step below only runs after a REAL trading-day cycle.
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: PYTHONPATH=. python scripts/run_paper_trading.py ${{ (github.event_name == 'workflow_dispatch' && inputs.force) && '--force' || '' }}

      - name: Run Analysis Engine (only after a successful trading-day cycle)
        if: steps.check_genuine.outputs.genuine == 'true' && steps.paper_trading.outputs.ran_cycle == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: PYTHONPATH=. python scripts/analysis_engine.py

      - name: Run Learning Engine (observe closed trades — never changes strategy)
        if: steps.check_genuine.outputs.genuine == 'true' && steps.paper_trading.outputs.ran_cycle == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: PYTHONPATH=. python scripts/learning_engine.py

      - name: Run Optimizer (recommendations only — never auto-applied)
        if: steps.check_genuine.outputs.genuine == 'true' && steps.paper_trading.outputs.ran_cycle == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: PYTHONPATH=. python scripts/optimizer.py

      - name: Commit updated paper-trading state back to repo
        if: steps.check_genuine.outputs.genuine == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- reports/ storage/trades/ storage/reports/
          git diff --staged --quiet || git commit -m "Paper trading + analysis + learning update: $(date -u +'%Y-%m-%d %H:%M UTC')"
          PUSH_OK=false
          for i in 1 2 3 4 5; do
            if git push; then
              PUSH_OK=true
              break
            fi
            echo "Push rejected (likely a concurrent workflow pushed first) — pulling and retrying ($i/5)..."
            git stash --include-untracked
            git pull --rebase origin main
            git stash pop || true
            sleep 60
          done
          if [ "$PUSH_OK" = false ]; then
            echo "::error::Push failed after 5 attempts — commit exists locally but was NOT pushed to remote. Data may be lost unless a future run recovers it."
            exit 1
          fi
