name: Clean Portfolio State

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true = report only (no changes), false = actually repair and commit"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

concurrency:
  group: repo-write-lock
  cancel-in-progress: false

jobs:
  clean:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run clean_portfolio_state.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            PYTHONPATH=. python scripts/clean_portfolio_state.py --dry-run
          else
            PYTHONPATH=. python scripts/clean_portfolio_state.py
          fi

      - name: Commit repaired state back to repo (only if not dry-run)
        if: inputs.dry_run == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- storage/trades/virtual_portfolio_state.json
          git diff --staged --quiet || git commit -m "Repair corrupted portfolio state (NaN cleanup)"
          PUSH_OK=false
          for i in $(seq 1 12); do
            if git diff --staged --quiet; then
              PUSH_OK=true
              break
            fi
            if git push; then
              PUSH_OK=true
              break
            fi
            echo "Push rejected (likely a concurrent workflow pushed first) — pulling and retrying ($i/12)..."
            git stash --include-untracked
            git pull --rebase origin main
            git stash pop || true
            sleep 300
          done
          if [ "$PUSH_OK" = false ]; then
            echo "::error::Push failed after 5 attempts — commit exists locally but was NOT pushed to remote. Data may be lost unless a future run recovers it."
            exit 1
          fi
