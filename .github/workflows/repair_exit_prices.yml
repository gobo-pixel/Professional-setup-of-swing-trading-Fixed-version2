name: Repair Exit Prices

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true = report only (no changes), false = actually repair and commit"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

jobs:
  repair:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run repair_exit_prices.py
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            PYTHONPATH=. python scripts/repair_exit_prices.py --dry-run
          else
            PYTHONPATH=. python scripts/repair_exit_prices.py
          fi

      - name: Commit recovered data back to repo (only if not dry-run)
        if: inputs.dry_run == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- storage/trades/
          git diff --staged --quiet || git commit -m "Recover real historical exit prices for bug-affected trades"
          git diff --staged --quiet || git push
