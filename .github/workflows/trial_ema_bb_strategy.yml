name: Trial EMA(50/200) Strategy — Nightly Run (temporary experiment)

# TEMPORARY — separate from Daily Scan / Paper Trading. Does not call
# scripts/run_paper_trading.py or scripts/generate_full_report.py, so
# the live production pipeline's own schedule is completely unaffected
# by this workflow existing or running.
#
# CHANGED 2026-09-03 (per explicit request): this is now the ONLY run,
# once per night, after market close, using EOD data — it opens NEW
# positions AND monitors/closes already-open ones in the same pass
# (see scripts/trial_ema_bb_strategy.py's module docstring). There is
# no more --mode flag and no more separate intraday monitor workflow —
# trial_position_monitor.yml (the old 4x/day 9:30/11:30/13:30/14:30 IST
# cron) is RETIRED and should be deleted from the repo; its job is done
# here now.

on:
  schedule:
    - cron: "30 14 * * *"  # 8:00 PM IST (14:30 UTC)
  workflow_dispatch:
    inputs:
      symbols:
        description: "Optional — comma-separated symbols to test with instead of the full Nifty500 watchlist (e.g. 'HDFCBANK.NS,TCS.NS'). Leave blank for the full watchlist."
        required: false
        default: ""

# BUG FIX (2026-08-25): this used to share "repo-write-lock" with the
# ENTIRE production pipeline (daily_scan/morning_executor/paper_trading/
# market_intelligence). GitHub Actions only keeps ONE pending run per
# concurrency group — a NEW trigger queued behind a busy group CANCELS
# whichever run was already waiting. Near market-open, this trial
# workflow's own schedule collided with morning_executor/paper_trading's
# schedule often enough that production runs were getting silently
# cancelled (no error, just never ran) — exactly what "TEMPORARY —
# ...completely unaffected..." above promised would NOT happen. Own,
# separate group restores that isolation for real.
concurrency:
  group: trial-strategy-write-lock
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  trial_scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run trial EMA(50/200) strategy
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          PYTHONPATH=. python scripts/trial_ema_bb_strategy.py \
            ${{ inputs.symbols != '' && format('--symbols "{0}"', inputs.symbols) || '' }}

      - name: Commit updated trial state back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- storage/trial_trades/
          git diff --staged --quiet || git commit -m "Trial EMA strategy nightly run: $(date -u +'%Y-%m-%d %H:%M UTC')"
          PUSH_OK=false
          for i in 1 2 3 4 5; do
            if git push; then
              PUSH_OK=true
              break
            fi
            echo "Push rejected (likely a concurrent workflow pushed first) — pulling and retrying ($i/5)..."
            git stash --include-untracked
            git pull --rebase origin main
            git stash pop || true
            sleep 60
          done
          if [ "$PUSH_OK" = false ]; then
            echo "::error::Push failed after 5 attempts — commit exists locally but was NOT pushed to remote."
            exit 1
          fi
