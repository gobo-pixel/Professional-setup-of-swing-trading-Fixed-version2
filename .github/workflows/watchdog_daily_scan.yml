name: Watchdog - Daily Scan

on:
  schedule:
    - cron: "45 17 * * *"  # 11:15 PM IST — 45 min after Daily Scan's 10:30 PM IST expected start
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  watchdog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: pip install requests
      - name: Check Daily Scan status
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/watchdog_daily_scan.py
