name: Market Intelligence

on:
  schedule:
    # Post-market-close monitoring, 6x per day (IST -> UTC):
    - cron: "30 11 * * *"   # 5:00 PM IST
    - cron: "30 21 * * *"   # 3:00 AM IST (next day)
    - cron: "0 3 * * *"     # 8:30 AM IST
  workflow_dispatch:

concurrency:
  group: repo-write-lock
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  market_intelligence:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Market Intelligence (research only, advisory Telegram alerts)
        # The Python script itself is the authoritative trading-day gate
        # (core/trading_calendar.py) — cron does not understand NSE
        # holidays, so this is a no-op on weekends/holidays regardless
        # of the schedule firing.
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: PYTHONPATH=. python scripts/run_market_intelligence.py

      - name: Commit updated research logs back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -- storage/reports/
          git diff --staged --quiet || git commit -m "Market intelligence update: $(date -u +'%Y-%m-%d %H:%M UTC')"
          PUSH_OK=false
          for i in $(seq 1 12); do
            if git push; then
              PUSH_OK=true
              break
            fi
            echo "Push rejected (likely a concurrent workflow pushed first) — pulling and retrying ($i/12)..."
            git stash --include-untracked
            git pull --rebase origin main
            git stash pop || true
            sleep 300
          done
          if [ "$PUSH_OK" = false ]; then
            echo "::error::Push failed after 5 attempts — commit exists locally but was NOT pushed to remote. Data may be lost unless a future run recovers it."
            exit 1
          fi
